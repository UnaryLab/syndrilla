decoder:
  algorithm: bp_sf
  check_type: hx
  max_iter: 181
  dtype: float64
  # syndrome-flipping (SF) post-processing on samples BP leaves unconverged
  sf:
    topk: 20      # number of most-oscillating bits used as flip candidates
    w_min: 0      # minimum flip weight
    w_max: 2      # maximum flip weight
    n_sample: 200 # max combinations sampled per weight
  device:
    device_type: cpu
    device_idx: 0
