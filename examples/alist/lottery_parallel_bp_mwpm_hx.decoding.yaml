decoding:
  algorithm: [bp_lottery_parallel, mwpm]
  check_type: hx
  dtype: float64
  device:
    device_type: cuda
    device_idx: 0
  config:
    - max_iter: 50
      random_machine: sobol
      num_parallel: 8
      seeds: [11, 22, 33, 44, 55, 66, 77, 88]
      ensemble_llr: true
    - weights: posterior
