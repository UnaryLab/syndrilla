decoder:
  algorithm: saq
  check_type: hx
  dtype: float32
  device:
    device_type: cuda
    device_idx: 0
  config:
    model:
      d_model: 128
      N_dec: 6
      h: 16
      dropout: 0.0
      no_mask: 0
    cpnd:
      enable: true
      passes: 1
    optimizer:
      lr: 5.0e-4
      weight_decay: 5.0e-8
      min_lr: 1.0e-6
    train:
      epochs: 100
      batches_per_epoch: 200
      val_batches: 20
      seed: 42
      # optional: cap how many epochs the result yaml and the json history carry,
      # keeping the most recent this many plus the best epoch. Remove the key and
      # they carry every epoch, which is one value per epoch in every column
      # however long the run is.
      epochs_saved: 10
