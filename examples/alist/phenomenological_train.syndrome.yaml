# Training-only measurement noise: `measurement_error_rate` is a [lower, upper, points]
# range split into that many levels, and every shot draws its own, so one run covers a
# stretch of the measurement-noise curve. The prior folded into the decoder's llr0 is
# the level that shot drew. A scalar rate decodes at that one level, see
# phenomenological.syndrome.yaml.
# `rounds` is 1 because the trainable decoders take a single round (saq refuses a rounds
# dimension); the sweep here is over measurement noise, not over rounds.
syndrome:
  measure: phenomenological
  rounds: 1
  measurement_error_rate: [0.001, 0.05, 9]
