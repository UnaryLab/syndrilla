# Decoding config for the learned `saq` decoder on the stim circuit-level path.
# Train first with train_stim_saq.decoder.yaml, then point `checkpoint` at the weights
# that run wrote. Checkpoints from this path are named after the detector error model
# they were trained on (`saq_hx_dem<detectors>x<mechanisms>.pt`), since a DEM column is a
# circuit fault mechanism and carries no code distance.
# `model` has to match the architecture that was trained.
decoder:
  algorithm: saq
  check_type: hx
  dtype: float32
  device:
    device_type: cpu
    device_idx: 0
  config:
    checkpoint: tests/test_outputs/saq_hx_dem24x221_best.pt
    model:
      d_model: 128
      N_dec: 4
      h: 8
      dropout: 0.0
      no_mask: 0
    cpnd:
      enable: true
      passes: 1
