name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          pip install --upgrade pip
          pip install -e . --no-deps
          pip install pytest pyyaml yamlordereddictloader loguru numpy scipy pyfiglet
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install stim ldpc

      - name: Run tests
        run: pytest -v
